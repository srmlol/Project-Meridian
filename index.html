<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Meridian</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #040d12; font-family: Arial, sans-serif; }
    #map { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map', {
      center: [20, 0],
      zoom: 2,
      minZoom: 2,
      maxZoom: 10,
      zoomControl: true
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© CartoDB',
      subdomains: 'abcd'
    }).addTo(map);

    // Load country boundaries
    fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: '#00ff88',
            weight: 0.5,
            fillColor: '#0a2a1a',
            fillOpacity: 0.3
          },
          onEachFeature: function(feature, layer) {
            layer.on({
              mouseover: function(e) {
                e.target.setStyle({ fillOpacity: 0.6, fillColor: '#00ff88' });
              },
              mouseout: function(e) {
                e.target.setStyle({ fillOpacity: 0.3, fillColor: '#0a2a1a' });
              },
              click: function(e) {
                const name = feature.properties.ADMIN;
                alert('You clicked: ' + name);
              }
            });
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
